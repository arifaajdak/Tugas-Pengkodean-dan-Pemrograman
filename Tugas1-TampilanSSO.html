<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>SSO Universitas Diponegoro</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: url('https://ppid.undip.ac.id/wp-content/uploads/2023/08/img-widya-puraya-undip-1023x614.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    .login-container {
      max-width: 400px;
      margin: 50px auto;
      background-color: rgba(0, 32, 96, 0.95); /* Biru tua dengan transparansi */
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      text-align: center;
      color: white;
    }

    .login-container img {
      width: 130px;
      margin-bottom: 15px;
    }

    h2 {
      margin: 0;
      font-size: 24px;
      color: white;
    }

    h3 {
      margin-top: 5px;
      font-weight: normal;
      color: #ccc;
    }

    input[type="text"],
    input[type="password"] {
      width: 90%;
      padding: 12px;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 95%;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    .login-btn {
      background-color: #2b4eff;
      color: white;
      margin-top: 10px;
    }

    .reset-btn {
      background-color: #f44336;
      color: white;
      margin-top: 10px;
    }

    .links {
      margin-top: 15px;
      font-size: 14px;
      color: #ccc;
    }

    .links a {
      color: #aad4ff;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 14px;
      color: #eee;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="https://1.bp.blogspot.com/-tThKR0i2DdQ/XrO4fFiulNI/AAAAAAAAB_s/4_UY2xeR3SsE9_5MGBdvsQtBJgNxf9e_wCLcBGAsYHQ/s1600/Logo%2BUndip%2BUniversitas%2BDiponegoro.png" alt="Logo UNDIP">
    <h2>Single Sign On (SSO)</h2>
    <h3>Universitas Diponegoro</h3>
    <p>Silahkan Masuk</p>
    <input type="text" placeholder="NIM/NIP/username/e-mail official Undip">
    <button class="login-btn">🔒 LOGIN</button>
    <button class="reset-btn">💬 Reset Password</button>

    <div class="links">
      <p>Belum memiliki akun? <a href="#">Daftar sekarang!</a></p>
      <p><a href="#">Pendaftaran alumni klik disini</a></p>
    </div>
  </div>

  <footer>
    © 2025 DSTI Universitas Diponegoro, <a href="#">All rights reserved.</a>
  </footer>
</body>
</html>
