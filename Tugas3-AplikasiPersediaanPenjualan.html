<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aplikasi Persediaan & Penjualan</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <style>
    body {
      background-color: #fef9f4;
      font-family: 'Segoe UI', sans-serif;
    }
    .card-header.bg-earth-1 {
      background-color: #d8c3a5; /* beige */
      color: #4e342e;
    }
    .card-header.bg-earth-2 {
      background-color: #a5a58d; /* sage */
      color: #fff;
    }
    .card-header.bg-earth-3 {
      background-color: #cb997e; /* terracotta */
      color: #fff;
    }
    .btn-earth {
      background-color: #b5a68d;
      color: #fff;
      border: none;
    }
    .btn-earth:hover {
      background-color: #a28d72;
    }
    .table thead {
      background-color: #f4e1d2;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4">Aplikasi Persediaan & Penjualan</h2>

    <div class="card">
      <div class="card-header bg-earth-1">Tambah Produk</div>
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-4">
            <input type="text" id="productName" class="form-control" placeholder="Nama Produk">
          </div>
          <div class="col-md-3">
            <input type="number" id="productPrice" class="form-control" placeholder="Harga">
          </div>
          <div class="col-md-3">
            <input type="number" id="productStock" class="form-control" placeholder="Stok">
          </div>
          <div class="col-md-2">
            <button class="btn btn-earth w-100" onclick="addProduct()">Tambah</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card mt-4">
      <div class="card-header bg-earth-2">Daftar Produk</div>
      <div class="card-body">
        <table class="table table-bordered">
          <thead>
            <tr>
              <th>Nama</th>
              <th>Harga</th>
              <th>Stok</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="productTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card mt-4">
      <div class="card-header bg-earth-3">Riwayat Penjualan</div>
      <div class="card-body">
        <table class="table table-bordered">
          <thead>
            <tr>
              <th>Produk</th>
              <th>Jumlah</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="salesHistoryBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    let products = [];
    let salesHistory = [];

    function addProduct() {
      let name = document.getElementById("productName").value;
      let price = parseFloat(document.getElementById("productPrice").value);
      let stock = parseInt(document.getElementById("productStock").value);

      if (!name || isNaN(price) || isNaN(stock)) {
        alert("Semua kolom harus diisi dengan benar!");
        return;
      }

      products.push({ name, price, stock });
      renderProducts();
      document.getElementById("productName").value = "";
      document.getElementById("productPrice").value = "";
      document.getElementById("productStock").value = "";
    }

    function renderProducts() {
      let tbody = document.getElementById("productTableBody");
      tbody.innerHTML = "";

      products.forEach((product, index) => {
        let row = `<tr>
          <td>${product.name}</td>
          <td>Rp ${product.price.toLocaleString()}</td>
          <td>${product.stock}</td>
          <td><button class='btn btn-sm btn-danger' onclick='sellProduct(${index})'>Jual</button></td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    function sellProduct(index) {
      let quantity = prompt("Masukkan jumlah yang ingin dijual:");
      quantity = parseInt(quantity);
      if (isNaN(quantity) || quantity <= 0 || quantity > products[index].stock) {
        alert("Jumlah tidak valid!");
        return;
      }

      products[index].stock -= quantity;
      salesHistory.push({
        name: products[index].name,
        quantity: quantity,
        total: products[index].price * quantity
      });
      renderProducts();
      renderSalesHistory();
    }

    function renderSalesHistory() {
      let tbody = document.getElementById("salesHistoryBody");
      tbody.innerHTML = "";

      salesHistory.forEach(sale => {
        let row = `<tr>
          <td>${sale.name}</td>
          <td>${sale.quantity}</td>
          <td>Rp ${sale.total.toLocaleString()}</td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }
  </script>
</body>
</html>
